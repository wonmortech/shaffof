name: Bug
description: Something on the site or in the docs is wrong or broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problem? Do not use this form: see SECURITY.md."
  - type: input
    id: where
    attributes:
      label: Where
      description: URL or file
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "Steps: 1. open ... 2. click ... I expected ..., but ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: "Chrome 142 on Android 15"
