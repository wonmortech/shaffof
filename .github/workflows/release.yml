name: release

# On a version tag: build a reproducible archive of site/, check it is byte-identical when built twice,
# sign build provenance with Sigstore (GitHub attestations), and publish a GitHub release.
# Verify a download: gh attestation verify shaffof-site-<version>.tar.gz -R wonmortech/shaffof
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check site
        run: node tools/check-site.mjs

      - name: Build archive twice and compare
        id: build
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          name="shaffof-site-$ver.tar.gz"
          epoch=$(git log -1 --format=%ct)
          pack() {
            tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
                --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime -cf - site LICENSE | gzip -n -9 > "$1"
          }
          mkdir -p dist
          pack "dist/$name"
          pack "$RUNNER_TEMP/$name"
          cmp "dist/$name" "$RUNNER_TEMP/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ steps.build.outputs.name }}
            dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.build.outputs.name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/$NAME.intoto.jsonl"
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0, h) == 1 {f = 1; next} f && /^(## )?\[/ {exit} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Shaffof $ver" --notes-file notes.md
